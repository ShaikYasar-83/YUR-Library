<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Requests — YUR LIBRARY</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpeg"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>

<!-- ── Top Navbar ── -->
<nav class="sticky-navbar">
  <div class="container-custom navbar-inner">
    <a class="nav-logo" href="/dashboard.html">
      <img src="/images/logo.jpg" alt="YUR LIBRARY Logo" class="nav-logo-img" />
      <span>YUR LIBRARY</span>
    </a>
    <div class="nav-links">
      <a class="nav-item" href="/dashboard.html">Dashboard</a>
      <a class="nav-item" href="/upload.html">Upload Notes</a>
      <a class="nav-item" href="/requests.html">Requests</a>
    </div>
    <div class="nav-right">
      <div class="user-pill">
        <div class="user-avatar" id="nav-avatar">S</div>
        <span id="nav-name">Student</span>
      </div>
      <button class="btn-icon" onclick="logout()" title="Logout">
        <i class="bi bi-box-arrow-right"></i>
      </button>
    </div>
  </div>
</nav>

<!-- ── Main Content ── -->
<div class="container-custom" style="padding-top: 1.5rem;">
  
  <div class="page-header" style="text-align: center; justify-content: center; flex-direction: column; align-items: center;">
    <h1 class="page-title"><i class="bi bi-chat-square-text" style="color: var(--accent-1);"></i> Request a Note</h1>
    <p class="page-subtitle" style="max-width: 500px;">Can't find what you need? Let the community know and an admin will try to source it for you.</p>
  </div>

  <div class="upload-panel mb-5">
    <form id="request-form" novalidate>

      <div class="mb-4">
        <label class="form-label" for="req-subject">Subject <span style="font-weight:400; color:var(--text-muted)">(optional)</span></label>
        <input id="req-subject" type="text" class="form-control" placeholder="e.g. Internet of Things"/>
      </div>

      <div class="mb-4">
        <label class="form-label" for="req-text">Detailed Description</label>
        <textarea id="req-text" class="form-control" rows="3" placeholder="e.g. Need IoT Unit 3 notes covering MQTT, Zigbee protocols... Minimum 10 characters." required></textarea>
      </div>

      <button type="submit" class="btn-primary-custom" id="req-btn">
        <span id="req-btn-text">Send Request</span>
        <span id="req-btn-loading" style="display:none">
          <div class="spinner"></div> Sending...
        </span>
      </button>

    </form>
  </div>

  <hr style="border-color: var(--border); margin: 3rem 0;">

  <!-- My Requests Cards Array -->
  <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom: 1.5rem;">
    <h3 style="font-size:1.25rem; margin:0;">Your Requests <span style="font-size:0.85rem; font-weight:500; color:var(--text-muted); margin-left:0.5rem;" id="req-count">0 requests</span></h3>
  </div>
  
  <div id="requests-container">
    <div class="loading-block"><div class="spinner"></div><p>Fetching your requests...</p></div>
  </div>

</div>

<script src="/js/api.js"></script>
<script src="/js/requests.js"></script>
</body>
</html>
