<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — YUR LIBRARY</title>
  <script>
     // Automatically redirect to the modern React-based login
     window.location.href = "/login";
  </script>
</head>
<body class="bright-theme">
<div class="auth-container">
  <div class="auth-card">

    <div class="auth-header">
      <div class="nav-logo" style="justify-content: center; margin-bottom: 0.5rem; font-size: 1.5rem;">
        <div class="icon-box">📚</div>
        <span>YUR LIBRARY</span>
      </div>
      <p style="color:var(--text-muted); font-size:0.9rem;">Sign in to access your college notes</p>
    </div>

    <!-- Alert container removed because we are using toast-container now -->

    <form id="login-form" novalidate>
      <div class="mb-3" style="margin-bottom: 1.25rem;">
        <label class="form-label" for="email">Email Address</label>
        <input id="email" type="email" class="form-control" placeholder="you@college.edu" required/>
      </div>
      <div class="mb-4" style="margin-bottom: 2rem;">
        <label class="form-label" for="password">Password</label>
        <div style="position:relative">
          <input id="password" type="password" class="form-control" placeholder="Enter password" required style="padding-right:2.75rem"/>
          <button type="button" id="toggle-pw" style="position:absolute;right:0.75rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem;">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary-custom" id="login-btn">
        <span id="btn-text">Sign In <i class="bi bi-arrow-right ml-1"></i></span>
        <span id="btn-loading" style="display:none"><div class="spinner"></div></span>
      </button>
    </form>

    <p style="text-align:center;margin-top:2rem;font-size:0.875rem;color:var(--text-muted)">
      Don't have an account?
      <a href="register.html" style="color:var(--accent-1);font-weight:600;margin-left:0.25rem;">Create account</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
