<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — YUR LIBRARY</title>
  <link rel="icon" type="image/jpeg" href="/favicon.jpeg"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="auth-container">
  <div class="auth-card" style="max-width:520px;">
    <div class="auth-header">
      <div class="nav-logo" style="justify-content: center; margin-bottom: 0.5rem; font-size: 1.5rem;">
        <div class="icon-box">📚</div>
        <span>YUR LIBRARY</span>
      </div>
      <p style="color:var(--text-muted); font-size:0.9rem;">Join the community to share and download notes</p>
    </div>

    <!-- Alert handled by Toast system automatically -->

    <form id="register-form" novalidate>
      <div id="reg-fields">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem;">
          <div>
            <label class="form-label" for="name">Full Name</label>
            <input id="name" type="text" class="form-control" placeholder="Jane Doe" required/>
          </div>
          <div>
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" class="form-control" placeholder="jane@college.edu" required/>
          </div>
        </div>

        <div style="margin-bottom:1.25rem;">
          <label class="form-label" for="password">Password <span style="font-weight:400;color:var(--text-muted)">(min 6 chars)</span></label>
          <input id="password" type="password" class="form-control" placeholder="Create a strong password" required/>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.25rem;margin-bottom:1.25rem;">
          <div>
            <label class="form-label" for="college">College</label>
            <input id="college" type="text" class="form-control" placeholder="University Name" required/>
          </div>
          <div>
            <label class="form-label" for="branch">Branch</label>
            <input id="branch" type="text" class="form-control" placeholder="Computer Science" required/>
          </div>
        </div>

        <div style="margin-bottom: 2rem;">
          <label class="form-label" for="year">Year of Study</label>
          <select id="year" class="form-select" required>
            <option value="" disabled selected>Select year...</option>
            <option value="1">1st Year</option>
            <option value="2">2nd Year</option>
            <option value="3">3rd Year</option>
            <option value="4">4th Year</option>
            <option value="5">5th Year</option>
          </select>
        </div>

        <button type="submit" class="btn-primary-custom" id="reg-btn">
          <span id="btn-text">Create Account <i class="bi bi-person-plus ml-1"></i></span>
          <span id="btn-loading" style="display:none"><div class="spinner"></div></span>
        </button>
      </div>

      <!-- Verification Section (Hidden by default) -->
      <div id="verify-section" style="display: none;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <p style="color: var(--text-muted); font-size: 0.9rem;">We've sent a 6-digit code to <strong id="display-email"></strong>. Please enter it below to verify your account.</p>
        </div>
        
        <div style="margin-bottom: 2rem;">
          <label class="form-label" for="otp" style="text-align: center; display: block;">Verification Code</label>
          <input id="otp" type="text" class="form-control" placeholder="000000" maxlength="6" 
                 style="text-align: center; font-size: 1.5rem; letter-spacing: 8px; font-weight: bold;" required/>
        </div>

        <button type="button" class="btn-primary-custom" id="verify-btn">
          <span id="verify-btn-text">Verify Account <i class="bi bi-check-circle ml-1"></i></span>
          <span id="verify-btn-loading" style="display:none"><div class="spinner"></div></span>
        </button>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem;">
          <p style="color: var(--text-muted);">
            Didn't receive the code? 
            <a href="#" id="resend-otp-link" style="color: var(--accent-1); font-weight: 600; margin-left: 0.5rem; text-decoration: none;">Resend OTP</a>
          </p>
          <a href="#" id="back-to-reg" style="color: var(--text-muted); font-size: 0.8rem; margin-top: 1rem; display: inline-block; text-decoration: none;">
            ← Back to registration
          </a>
        </div>
      </div>
    </form>


    <p style="text-align:center;margin-top:2rem;font-size:0.875rem;color:var(--text-muted)">
      Already have an account?
      <a href="index.html" style="color:var(--accent-1);font-weight:600;margin-left:0.25rem;">Sign in</a>
    </p>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
